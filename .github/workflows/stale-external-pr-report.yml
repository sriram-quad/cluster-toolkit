---
name: Stale External PRs Daily Report

# [AUTO SCHEDULE]
# Runs automatically every weekday (Monday-Friday) at 11:30 UTC (5:00 PM Asia/Kolkata).
# Also supports manual one-click runs from the Actions tab (workflow_dispatch).
# yamllint disable-line rule:truthy
on:
  schedule:
  - cron: "30 11 * * 1-5"  # Mon-Fri 5:00 PM Asia/Kolkata (11:30 UTC)
  workflow_dispatch:
    inputs:
      min_age_days:
        description: "Minimum PR age in days to include in the report"
        required: false
        default: "7"
        type: string
      exclude_quad:
        description: "Exclude *-quad Quadrant PRs (included by default)"
        required: false
        default: false
        type: boolean

# [PERMISSION]
# Strictly READ-ONLY repository permissions using the automatic GITHUB_TOKEN.
# No Personal Access Token (PAT) or write permission is required.
#   - contents: read      -> Checkout repository scripts
#   - pull-requests: read -> Fetch open/closed PRs, reviews, commits, merge state
#   - issues: read        -> Fetch PR conversation comments and labels
permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  stale-pr-report:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      with:
        persist-credentials: false

    # [HISTORY PERSISTENCE]
    # Restores prior daily snapshots so the master Excel workbook and dashboard
    # maintain multi-day history and compute Day-over-Day PR diffs automatically.
    - name: Restore daily report history
      uses: actions/cache/restore@v4
      with:
        path: stale_pr_reports/history
        key: stale-pr-history-${{ github.run_id }}
        restore-keys: |
          stale-pr-history-

    # [FETCH & REPORT GEN]
    # Fetches live open PRs from GitHub REST API, evaluates review/commit/conflict
    # status, and outputs:
    #   1. stale_pr_reports/stale_pr_master_tracker.xlsx (multi-sheet Excel)
    #   2. stale_pr_reports/daily/stale_pr_report_YYYY-MM-DD.xlsx
    #   3. stale_pr_reports/stale_pr_dashboard.html (interactive HTML dashboard)
    #   4. stale_pr_reports/daily/stale_pr_chat_alert_YYYY-MM-DD.txt
    #   5. GitHub Actions Step Summary Markdown table
    - name: Generate Stale External PRs Excel and Dashboard
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO_NAME: ${{ vars.STALE_PR_TARGET_REPO || 'GoogleCloudPlatform/cluster-toolkit' }}
        MIN_AGE_DAYS: ${{ inputs.min_age_days || '7' }}
        EXCLUDE_QUAD: ${{ inputs.exclude_quad || 'false' }}
        SHEET_SHARE_URL: ${{ vars.STALE_PR_SHEET_URL || '' }}
      run: |
        EXTRA_ARGS=()
        if [[ "${EXCLUDE_QUAD}" == "true" ]]; then
          EXTRA_ARGS+=("--exclude-quad")
        fi
        python3 tools/github/stale_pr_report/generate_stale_pr_report.py \
          --repo "${REPO_NAME}" \
          --min-age-days "${MIN_AGE_DAYS}" \
          --output-dir stale_pr_reports \
          --github-summary "${GITHUB_STEP_SUMMARY}" \
          --wait-on-ratelimit \
          "${EXTRA_ARGS[@]}"

    - name: Save updated daily report history
      uses: actions/cache/save@v4
      if: always()
      with:
        path: stale_pr_reports/history
        key: stale-pr-history-${{ github.run_id }}

    # [ARTIFACT DELIVERY]
    # Uploads the Excel tracker, daily sheet, interactive HTML dashboard, and
    # formatted Chat alert so anyone can download them from the workflow run.
    - name: Upload Excel report and HTML dashboard artifacts
      uses: actions/upload-artifact@v4
      with:
        name: stale-external-pr-report-${{ github.run_number }}
        path: |
          stale_pr_reports/stale_pr_master_tracker.xlsx
          stale_pr_reports/stale_pr_dashboard.html
          stale_pr_reports/daily/
        retention-days: 90

    # [ACTION ITEM — OPTIONAL GOOGLE CHAT ALERT]
    # To auto-post the 5:00 PM report into a Google Chat space, a repo admin can
    # add an incoming webhook URL as repository secret `GCHAT_WEBHOOK_URL`.
    # If not configured, this step exits cleanly without failing the workflow.
    - name: Post daily alert to Google Chat (optional)
      if: success()
      env:
        GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [[ -z "${GCHAT_WEBHOOK_URL}" ]]; then
          echo "GCHAT_WEBHOOK_URL secret not configured; skipping Chat alert."
          exit 0
        fi
        python3 - << 'EOF'
        import json
        import os
        from pathlib import Path
        import urllib.request

        alert_text = Path("stale_pr_reports/stale_pr_chat_alert_latest.txt").read_text(encoding="utf-8")
        run_url = os.environ["RUN_URL"]
        payload = json.dumps({
            "text": f"{alert_text}\nExcel & Dashboard artifacts: {run_url}"
        }).encode("utf-8")
        req = urllib.request.Request(
            os.environ["GCHAT_WEBHOOK_URL"],
            data=payload,
            headers={"Content-Type": "application/json; charset=UTF-8"},
            method="POST",
        )
        with urllib.request.urlopen(req, timeout=20) as resp:
            print(f"Posted Google Chat alert (HTTP {resp.status}).")
        EOF
